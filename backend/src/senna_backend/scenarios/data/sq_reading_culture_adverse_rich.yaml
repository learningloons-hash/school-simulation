scenario_id: sq_reading_culture_adverse_rich
name: SQ Reading Culture Programme — Adverse Context, Rich Personas (Utility Test)
interaction_overlay: school_trinidad
context:
  # source: GM-F scenario-context-field Part A/B — adverse ecological contrast (not CIEPSS site claims)
  school_profile: "High-needs primary; stretched resources and frequent timetable trade-offs between competing priorities."
  leadership_stability: "Three principals in six years; senior leadership turnover has disrupted continuity."
  initiative_history: "Two prior whole-school initiatives were launched and abandoned; staff are wary of new programme layering."
  staff_capacity: "Departments report limited spare capacity for additional coordination beyond existing commitments."
policy_events:
  # source: Shuqun Primary page — whole-school reading culture approach
  1: "The school launches a whole-school approach to develop proficient readers by building passion for reading and teaching students how to read."
  # source: Shuqun Primary page — Reading Period
  2: "One period per week is set aside for reading; students engage in book exploration and extension activities during leisure reading time."
  # source: Shuqun Primary page — Reading Period activities
  3: "Book talks, storytelling sessions, and incentives for good readers are introduced to encourage more reading."
  # source: Shuqun Primary page — Reading Activity Programme
  4: "The EL and MT departments launch a joint Reading Activity Programme to promote reading of both EL and MT books with a combined rewards and recognition system."
  # source: Shuqun Primary page — Reading Activity Booklets
  5: "Reading Activity Booklets are issued for Lower Primary (P1–2), Middle Primary (P3–4), and Upper Primary (P5–6), each with reading activities to complete over the year."
  # source: Shuqun Primary page — Read@School / NLB
  6: "The Read@School project with the National Library Board continues, with assembly programmes such as Book Buzz to promote age-appropriate books."
  # source: Shuqun Primary page — Read@School storytelling
  7: "NLB-supported storytelling and book-promotion activities are scheduled across levels."
  # source: Shuqun Primary page — Reading Events / Parent-Child Reading
  8: "Parent-Child Reading sessions are organised for parents and students."
  # source: Shuqun Primary page — 2017 expansion
  9: "Parent-Child Reading is expanded to P1–4 parents and students on the largest scale offered to date."
  # source: Shuqun Primary page — programme consolidation
  10: "Staff review uptake of reading periods, booklet completion, NLB activities, and parent participation; adjustments are planned for the next cycle."
