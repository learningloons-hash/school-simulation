scenario_id: dsa_esports_teachers
name: "DSA Esports Expansion — Early-Career Secondary Teacher Focus Group"
groups:
  - group_id: early_career_teacher
    name: "Early-career secondary school teacher (ages 25–29)"
interaction_overlay: none
policy_events:
  1: "MOE announcement: Direct School Admission will expand to include competitive esports and video games (including game design and development) as a talent area for Secondary 1 admission. Participating schools will set their own selection criteria; detailed safeguards and implementation timeline are pending."
  2: "Facilitator probe: 'What does this change for you and your classroom over the next 12 months — how you advise students, workload, and what you think schools will expect from teachers?'"
  3: "MOE follow-up briefing: schools running pilots may consider tournament records and portfolios; MOE says safeguards on screen time and equity are 'under study' with no published timeline."
  4: "Facilitator probe: 'Do you trust this DSA route to select students fairly and for the right reasons — legitimacy compared with sport, music, or academic DSA areas?'"
  5: "Facilitator probe: 'What would you want to see from schools and MOE before this is rolled out more widely — criteria, teacher training, counselling support, equity across schools?'"
  6: "Facilitator closing: 'If MOE asked you for the one change you would demand before this rolls out — and your overall stance in one sentence — what would you say?'"
