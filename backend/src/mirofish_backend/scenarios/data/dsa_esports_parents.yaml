scenario_id: dsa_esports_parents
name: "DSA Esports Expansion — P5 Parent Focus Group"
groups:
  - group_id: loving_lion
    name: "Loving Lion archetype (IPS WP No.77, 2026: 40.8% of sample)"
  - group_id: new_age_parent
    name: "New-Age / New-School Parent archetype (IPS WP No.77, 2026: 34.3% of sample)"
  - group_id: detached_realist
    name: "Detached Realist archetype (IPS WP No.77, 2026: 24.9% of sample)"
  - group_id: ses_high
    name: "Higher-SES household (private property / EC proxy)"
  - group_id: ses_low
    name: "Lower-SES household (HDB 2-3 room proxy)"
interaction_overlay: none
policy_events:
  1: "MOE announcement: Direct School Admission will expand to include competitive esports and video games (including game design and development) as a talent area for Secondary 1 admission. Participating schools will set their own selection criteria; detailed safeguards and implementation timeline are pending."
  2: "Facilitator probe: 'What does this announcement change for you and your child over the next 12 months — expectations at home, enrichment choices, how you talk about secondary school options?'"
  3: "MOE follow-up briefing: schools running pilots may consider tournament records and portfolios; MOE says safeguards on screen time and equity are 'under study' with no published timeline."
  4: "Facilitator probe: 'Do you trust this DSA route to select students fairly and for the right reasons — more than other DSA areas, less, or about the same?'"
  5: "Facilitator probe: 'What would you want to see from schools and MOE before this is rolled out more widely — criteria, oversight, support for families who cannot pay for coaching or gear?'"
  6: "Facilitator closing: 'If MOE asked you for the one change you would demand before this rolls out — and your overall stance in one sentence — what would you say?'"
# Persona order: slot index sex alternation F,M,F,M,F,M (engine Demographics line).
