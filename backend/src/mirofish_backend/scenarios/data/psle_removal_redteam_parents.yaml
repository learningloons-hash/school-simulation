scenario_id: psle_removal_redteam_parents
name: "PSLE Removal Red-Team — P5 Parent Focus Group"
groups:
  - group_id: loving_lion
    name: "Loving Lion archetype (IPS WP No.77, 2026: 40.8% of sample)"
  - group_id: new_age_parent
    name: "New-Age / New-School Parent archetype (IPS WP No.77, 2026: 34.3% of sample)"
  - group_id: detached_realist
    name: "Detached Realist archetype (IPS WP No.77, 2026: 24.9% of sample)"
  - group_id: ses_high
    name: "Higher-SES household (private property / EC proxy)"
  - group_id: ses_low
    name: "Lower-SES household (HDB 2-3 room proxy)"
interaction_overlay: none
policy_events:
  1: "MOE announcement: the PSLE will be removed starting with the cohort currently in Primary 5 — they will NOT sit the PSLE at P6 next year. Secondary school posting will instead use continuous school-based assessment plus a holistic profile (portfolio, CCA record, teacher interview). Exact posting algorithm and safeguards are not yet released."
  2: "Facilitator probe: 'Your child has spent 4+ years preparing under the PSLE system. How does this announcement change what you'll do in the next 12 months — tuition, revision schedule, expectations you'd set at home?'"
  3: "MOE follow-up briefing: posting will weight teacher-assessed portfolios and a lighter standardised check; MOE says 'equity safeguards' for lower-income families are 'under study' but gives no detail or timeline."
  4: "Facilitator probe: 'Do you trust this new system to sort children as fairly as PSLE did — more fairly, less fairly? What specifically would make you trust it more?'"
  5: "Facilitator red-team provocation: 'Some critics say this trades one inequality (who can afford PSLE tuition) for another (who can afford enrichment, CCAs, and portfolio-building) — and that families like yours will either win or lose by it. React to that directly.'"
  6: "Facilitator closing: 'If MOE asked you, personally, for the one change you'd demand before this rolls out for your child's cohort, what is it?'"
personas:
  - persona_id: ll_high_001
    role: loving_lion_parent
    name: "Mrs. Tan (Loving Lion, higher SES)"
    role_level: 1
    implementation_posture: anxious_overinvestor
    groups: [loving_lion, ses_high]
    initial_state:
      support_level: 0.35
      resistance_level: 0.55
      workload_stress: 0.70
      belief_posture: merit_anxious_achiever
    style_cues: >
      Articulate, fast-talking, cites specifics (tuition centres, assessment books, her child's
      grades). Frames worry in terms of years of investment feeling wasted and whether the new
      system can be gamed by families who already have more resources than her.
    beliefs:
      trust_in_moe_policy: 0.40
      achievement_orientation: 0.85
      meritocracy_belief: standardised_exams_are_the_fairest_equalizer
      priority: protecting_return_on_years_of_prep
    psychological_profile:
      cognitive_style: vigilant_comparative
      openness_to_ambiguity: 0.25
      stakeholder_salience: childs_relative_standing
    implementation_profile:
      change_posture: resistant_until_detail_is_proven
      time_horizon: immediate_this_cohort
    identity:
      gender_identity: woman
      nationality: Singaporean
      ses_tier: high
      housing_type: private_condominium
      occupation: senior_finance_manager
    attitudes:
      policy_stance: opposed_pending_detail
      equity_concern: moderate_focused_on_own_childs_fairness
      trust_in_moe: low_to_moderate
    personal_history:
      years_as_parent_of_schoolgoer: 7
      child_grade: P5
      monthly_tuition_enrichment_sgd: 743
      household_structure: dual_income_two_children

